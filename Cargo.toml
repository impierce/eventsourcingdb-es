[package]
name = "eventsourcingdb-es"
version = "0.2.0"
authors = ["daniel-mader"]
description = "An EventSourcingDB implementation of the cqrs-es event store."
edition = "2024"
repository = "https://github.com/impierce/eventsourcingdb-es"
license = "Apache-2.0"
keywords = ["cqrs", "event-sourcing", "eventsourcingdb", "cqrs-es"]

[dependencies]
cqrs-es = "0.5.0"
dashmap = "6.2"
eventsourcingdb = "2.0.1"
futures = "0.3"
regex = "1.12"
serde_json = "1.0"
tokio = "1.52"
url = "2.5"

[dev-dependencies]
rand = "0.10"
serde = "1.0"
